- name: Verify token exists
  run: |
    if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
      echo "SUPABASE_ACCESS_TOKEN is empty"
      exit 1
    fi
    echo "Token is present"
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - name: Validate token with Supabase API
  run: |
    curl -sS -o /tmp/out.json -w "%{http_code}" \
      -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
      https://api.supabase.com/v1/projects > /tmp/status.txt
    STATUS=$(cat /tmp/status.txt)
    echo "HTTP $STATUS"
    cat /tmp/out.json
    test "$STATUS" = "200"
